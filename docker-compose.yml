services:

  app:
    image: aale-erp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aale-erp-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      # Persist uploads/logs/cache on the host; do NOT mount ./public here.
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
      - ./storage/framework/cache:/var/www/html/storage/framework/cache
      - ./storage/framework/sessions:/var/www/html/storage/framework/sessions
      - ./storage/framework/views:/var/www/html/storage/framework/views
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - aale_default

  nginx:
    image: aale-erp-nginx:latest
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        APP_IMAGE: aale-erp:latest
    container_name: aale-erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Only user uploads — never the whole ./public tree (that hid Vite builds).
      - ./storage/app/public:/var/www/html/public/storage:ro
    depends_on:
      - app
    networks:
      - aale_default

networks:
  aale_default:
    external: true
