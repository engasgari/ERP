services:

  app:
    image: aale-erp:latest
    container_name: aale-erp-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    networks:
      - aale_default

  nginx:
    image: nginx:alpine
    container_name: aale-erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - aale_default

networks:
  aale_default:
    external: true
